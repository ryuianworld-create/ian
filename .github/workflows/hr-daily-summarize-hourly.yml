# dailyHR — 매시간 요약 시도. Vercel Hobby 크론은 하루 1회까지만 되므로 GitHub Actions 가 API 의 summarize-ahead 를 매시간 호출한다.
# API 쪽에서 50분 간격·하루 실패 8회 상한으로 걸러 주므로 호출이 잦아도 모델 장애 때 호출·비용이 쌓이지 않는다.
# 비밀: 저장소 Settings → Secrets and variables → Actions → HR_DAILY_CRON_SECRET (Vercel hr-daily-api 의 EXTERNAL_CRON_SECRET 와 같은 값)
name: hr-daily summarize hourly

on:
  schedule:
    - cron: "20 * * * *" # 매시 20분 (UTC)
  workflow_dispatch: {}

concurrency:
  group: hr-daily-summarize
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Call summarize-ahead
        env:
          SECRET: ${{ secrets.HR_DAILY_CRON_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then echo "HR_DAILY_CRON_SECRET 가 비어 있습니다"; exit 1; fi
          code=$(curl -sS -m 330 -o /tmp/out.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $SECRET" \
            https://hr-daily-api.vercel.app/cron/summarize-ahead)
          echo "HTTP $code"
          head -c 1500 /tmp/out.json; echo
          case "$code" in 2*) exit 0 ;; *) exit 1 ;; esac
